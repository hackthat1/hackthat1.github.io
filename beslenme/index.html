<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1320">
<title>Beslenme Takip Dashboard</title>
<style>
:root{--bg:#09111c;--panel:#101b2a;--text:#eef4fb;--muted:#90a4b8;--line:#21354c;--accent:#64b5f6;--green:#62d394}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#07101a,#0d1724 45%,#0a1220);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:18px}h1{margin:0 0 5px;font-size:30px}.muted{color:var(--muted)}.small{font-size:12px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,button{font:inherit;border-radius:12px;border:1px solid var(--line)}input{background:#0c1724;color:#fff;padding:10px 12px}button{padding:10px 14px;background:#173453;color:#fff;font-weight:700;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(16,27,42,.95);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 32px rgba(0,0,0,.2)}.metric .title{color:var(--muted);font-size:13px}.metric .num{font-size:31px;font-weight:800;margin:7px 0}.unit{font-size:13px;color:var(--muted);font-weight:500}.progress{height:8px;border-radius:99px;background:#1d2e41;overflow:hidden}.bar{height:100%;background:var(--accent);width:0}.grid2{display:grid;grid-template-columns:1.7fr .8fr;gap:16px;margin-top:16px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-head h2{margin:0;font-size:18px}.pill{padding:5px 9px;border-radius:999px;background:#142c45;color:#b8d9f4;font-size:12px}table{width:100%;border-collapse:collapse}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}td{font-size:14px}.meal{display:inline-block;padding:4px 8px;border:1px solid #2b4663;border-radius:999px;font-size:12px}.summary{display:grid;gap:10px}.summary div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px}.week{display:grid;gap:9px}.dayrow{display:grid;grid-template-columns:64px 1fr 90px;gap:10px;align-items:center}.track{height:10px;background:#1d2e41;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--green)}.note{margin-top:14px;padding:12px 14px;border:1px dashed #35506d;border-radius:14px;color:#afc0d1;font-size:13px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:560px){.wrap{padding:14px}header{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:1fr 1fr}.metric .num{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1 id="title">Beslenme Takip Dashboard</h1><div class="muted">GitHub Pages • ChatGPT ile güncellenen günlük takip</div></div><div class="controls"><span class="small muted">Tarih</span><input id="date" type="date"><button id="refresh">Yenile</button></div></header>
<section class="cards">
<div class="card metric"><div class="title">Kalori</div><div class="num" id="kcal">0 <span class="unit">kcal</span></div><div class="progress"><div class="bar" id="kcalBar"></div></div><div class="small muted" id="kcalGoal"></div></div>
<div class="card metric"><div class="title">Protein</div><div class="num" id="protein">0 <span class="unit">g</span></div><div class="progress"><div class="bar" id="proteinBar"></div></div><div class="small muted" id="proteinGoal"></div></div>
<div class="card metric"><div class="title">Karbonhidrat</div><div class="num" id="carbs">0 <span class="unit">g</span></div><div class="progress"><div class="bar" id="carbsBar"></div></div><div class="small muted" id="carbsGoal"></div></div>
<div class="card metric"><div class="title">Yağ</div><div class="num" id="fat">0 <span class="unit">g</span></div><div class="progress"><div class="bar" id="fatBar"></div></div><div class="small muted" id="fatGoal"></div></div>
</section>
<section class="grid2">
<div class="card"><div class="section-head"><h2>Yediklerim</h2><span class="pill" id="count">0 kayıt</span></div><div style="overflow:auto"><table><thead><tr><th>Öğün</th><th>Besin</th><th>Miktar</th><th>Kalori</th><th>Protein</th><th>Karb.</th><th>Yağ</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="card"><div class="section-head"><h2>Gün Özeti</h2></div><div class="summary" id="summary"></div><div class="note" id="updated">Veriler yükleniyor…</div></div>
</section>
<section class="card" style="margin-top:16px"><div class="section-head"><h2>Son 7 Gün Kalori</h2><span class="small muted">Seçili tarihe göre</span></div><div class="week" id="week"></div></section>
</div>
<script>
const RAW='https://raw.githubusercontent.com/hackthat1/hackthat1.github.io/main/beslenme/data/';
let ENTRIES=[],CONFIG={goals:{}};const $=id=>document.getElementById(id);const fmt=n=>(Math.round((+n||0)*10)/10).toLocaleString('tr-TR');
function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
$('date').value=localDate();
async function load(){const v=Date.now();const [e,c]=await Promise.all([fetch(RAW+'entries.json?v='+v,{cache:'no-store'}).then(r=>r.json()),fetch(RAW+'config.json?v='+v,{cache:'no-store'}).then(r=>r.json())]);ENTRIES=e;CONFIG=c;render()}
function totals(date){return ENTRIES.filter(x=>x.date===date).reduce((a,x)=>{a.kcal+=+x.kcal||0;a.protein+=+x.protein||0;a.carbs+=+x.carbs||0;a.fat+=+x.fat||0;return a},{kcal:0,protein:0,carbs:0,fat:0})}
function metric(key,val,unit,goal){$(key).innerHTML=fmt(val)+' <span class="unit">'+unit+'</span>';const pct=goal?Math.min(100,val/goal*100):0;$(key+'Bar').style.width=pct+'%';$(key+'Goal').textContent=goal?(fmt(val)+' / '+fmt(goal)+' '+unit+' • %'+Math.round(val/goal*100)):'Hedef tanımsız'}
function render(){const date=$('date').value,day=ENTRIES.filter(x=>x.date===date),t=totals(date),g=CONFIG.goals||{};$('title').textContent=CONFIG.title||'Beslenme Takip Dashboard';metric('kcal',t.kcal,'kcal',+g.kcal||0);metric('protein',t.protein,'g',+g.protein||0);metric('carbs',t.carbs,'g',+g.carbs||0);metric('fat',t.fat,'g',+g.fat||0);$('count').textContent=day.length+' kayıt';$('rows').innerHTML=day.length?day.map(x=>'<tr><td><span class="meal">'+x.meal+'</span></td><td>'+x.food+'</td><td>'+x.amount+'</td><td>'+fmt(x.kcal)+' kcal</td><td>'+fmt(x.protein)+' g</td><td>'+fmt(x.carbs)+' g</td><td>'+fmt(x.fat)+' g</td></tr>').join(''):'<tr><td colspan="7"><div class="empty">Bu tarihte kayıt yok.</div></td></tr>';const kalan=g.kcal?Math.max(0,g.kcal-t.kcal):0;$('summary').innerHTML='<div><span>Toplam öğe</span><strong>'+day.length+'</strong></div><div><span>Kalori</span><strong>'+fmt(t.kcal)+' kcal</strong></div><div><span>Kalan kalori</span><strong>'+fmt(kalan)+' kcal</strong></div><div><span>Protein</span><strong>'+fmt(t.protein)+' g</strong></div><div><span>Karbonhidrat</span><strong>'+fmt(t.carbs)+' g</strong></div><div><span>Yağ</span><strong>'+fmt(t.fat)+' g</strong></div>';$('updated').textContent='Son veri güncellemesi: '+(CONFIG.lastUpdated||'bilinmiyor');renderWeek(date)}
function renderWeek(endDate){const end=new Date(endDate+'T00:00:00'),arr=[];for(let i=6;i>=0;i--){const d=new Date(end);d.setDate(end.getDate()-i);const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');arr.push({date:ds,kcal:totals(ds).kcal})}const max=Math.max(1,...arr.map(x=>x.kcal));$('week').innerHTML=arr.map(x=>'<div class="dayrow"><span class="small muted">'+x.date.slice(8,10)+'.'+x.date.slice(5,7)+'</span><div class="track"><div class="fill" style="width:'+x.kcal/max*100+'%"></div></div><strong style="text-align:right">'+Math.round(x.kcal)+' kcal</strong></div>').join('')}
$('date').addEventListener('change',render);$('refresh').addEventListener('click',load);load().catch(e=>{$('updated').textContent='Veri yüklenemedi: '+e.message});
</script>
</body>
</html>
